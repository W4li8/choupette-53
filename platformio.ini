; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Which app gets built/flashed by a plain `pio run` / `pio run -t upload`.
; Override per invocation with `-e rgb` or `-e motors` instead of editing this.
default_envs = motors

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200

[env:rgb]
build_flags = -D APP_RGB
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

[env:motors]
build_flags = -D APP_MOTORS
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

[env:lidar_point]
build_flags = -D APP_LIDAR_POINT -D SERIAL_DEBUG
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
	pololu/VL53L0X@^1.3.1

[env:lidar_matrix]
build_flags = -D APP_LIDAR_MATRIX -D SERIAL_DEBUG
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

[env:i2c_scan]
build_flags = -D APP_I2C_SCAN

[env:oled_hello]
build_flags = -D APP_OLED_HELLO
lib_deps =
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit GFX Library@^1.12.6

[env:chatter]
build_flags = -D APP_CHATTER

[env:chatter_microros]
; USB/CH340 link for now (shares the same physical wire as flashing) -
; switch board_microros_transport to a dedicated UART once that wiring
; exists, no firmware logic changes needed beyond this line.
board_microros_transport = serial
board_microros_distro = jazzy
build_flags = -D APP_CHATTER_MICROROS
lib_deps = https://github.com/micro-ROS/micro_ros_platformio
