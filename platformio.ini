; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Which app gets built/flashed by a plain `pio run` / `pio run -t upload`.
; Override per invocation with `-e rgb` or `-e motors` instead of editing this.
default_envs = motors

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
upload_port = /dev/cu.usbserial-110
monitor_port = /dev/cu.usbserial-110
monitor_speed = 115200

[env:rgb]
build_flags = -D APP_RGB
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0

[env:motors]
build_flags = -D APP_MOTORS
lib_deps = adafruit/Adafruit NeoPixel@^1.12.0
